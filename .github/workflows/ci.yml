name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Dummy secrets: tests only need them to be set and consistent.
  ALLOWED_ORIGINS: http://localhost:6767
  JWT_SECRET: ci-jwt-secret
  # In MB. over_limit tests build a body of MAX_BODY_LIMIT + 1, keep it small.
  MAX_BODY_LIMIT: 20
  # Integration tests still hardcode "files/", must match until they read this var.
  FILES_ROOT_PATH: files

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
